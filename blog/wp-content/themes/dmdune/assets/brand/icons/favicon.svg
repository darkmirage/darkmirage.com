    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a4a"/><stop offset=".75" stop-color="#4a5f8c"/><stop offset="1" stop-color="#c98a52"/></linearGradient>
    <clipPath id="c"><circle cx="16" cy="16" r="15.5"/></clipPath>
