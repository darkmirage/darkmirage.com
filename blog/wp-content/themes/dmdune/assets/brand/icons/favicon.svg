<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .sky { fill: url(#day); } .sun { fill: #fdf0d2; } .ink { fill: #15110e; } .gog { fill: #f2a23c; stroke: #15110e; stroke-width: .6; }
    @media (prefers-color-scheme: dark) { .sky { fill: url(#night); } .sun { fill: #f3e6c8; } .ink { fill: #05070b; } .gog { fill: #f0a35a; stroke: #05070b; } }
  </style>
  <defs>
